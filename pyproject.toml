[tool.deptry]
# 1. Tell deptry where your code lives (change "app" to your folder name)
# If your code is in the root, you can remove this or use "."
root = ["app"]

# 2. Tell deptry to ignore the "Implicit" tools you use but don't import
ignore_obsolete = [
    "uvicorn",           # The server
    "python-multipart",  # Required for Form data (login)
    "psycopg2-binary",   # DB Driver (used by SQLAlchemy internals)
    "python-dotenv",     # Loaded by Pydantic Settings
    "pip-audit",         # Security tool
    "deptry"             # The scanner itself
]

# 3. Mapping adjustments (Rarely needed, but good to know)
# Sometimes the pip name != import name.
# Example: pip install PyYAML -> import yaml
[tool.deptry.package_module_name_map]
PyYAML = "yaml"
python-jose = "jose"